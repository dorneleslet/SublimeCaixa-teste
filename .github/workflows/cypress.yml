name: Cypress Tests
on: 
  push:
    branches:
      - main

jobs:
  cypress-run:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start server
        run: 
          venv\Scripts\Activate
          python manage.py runserver &

      - name: Run Cypress Tests
        uses: cypress-io/github-actions@v6
        with:
          spec: |
            cypress/e2e/regressao.cy.js
            cypress/e2e/test-e2e.cy.js
            cypress/e2e/cadastro-massa.cy.js
          wait-on: 'http://localhost:8000/'