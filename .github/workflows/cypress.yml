name: Cypress Tests

on: 
  push:
    branches:
      - main

jobs:
  cypress-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install -r requirements.txt
          python manage.py migrate

      - name: Start server
        run: |
          source venv/bin/activate
          python manage.py runserver &

      - name: Run Cypress Tests
        uses: cypress-io/github-actions@v6.6.0
        with:
          spec: |
            cypress/e2e/regressao.cy.js
            cypress/e2e/test-e2e.cy.js
            cypress/e2e/cadastro-massa.cy.js
          wait-on: 'http://localhost:8000/'